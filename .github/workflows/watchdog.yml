name: Homeserver Cloud Watchdog

on:
  schedule:
    # Run every 5 minutes (fastest possible interval in GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-and-wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Watchdog Check & Outage Alerting
        env:
          ROUTER_HOST: ${{ secrets.ROUTER_HOST }}
          TARGET_MAC: ${{ secrets.TARGET_MAC }}
          CHECK_PORT: ${{ secrets.CHECK_PORT }}
          WAKE_PORTS: ${{ secrets.WAKE_PORTS || '443,59999,9' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SERVER_HEARTBEAT: ${{ vars.SERVER_HEARTBEAT }}
          SERVER_ALERT_STATE: ${{ vars.SERVER_ALERT_STATE }}
        run: |
          python3 watchdog.py
