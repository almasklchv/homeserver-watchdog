name: Homeserver Cloud Watchdog

on:
  schedule:
    # Backup cron starter in case the self-dispatching chain is ever interrupted
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Ensure only one active runner and at most one queued next-link exist at any time
concurrency:
  group: homeserver-watchdog-singleton
  cancel-in-progress: false

jobs:
  check-and-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 2-Minute Continuous Watchdog & Self-Chaining Loop
        env:
          ROUTER_HOST: ${{ secrets.ROUTER_HOST }}
          TARGET_MAC: ${{ secrets.TARGET_MAC }}
          CHECK_PORT: ${{ secrets.CHECK_PORT }}
          WAKE_PORTS: ${{ secrets.WAKE_PORTS || '443,59999,9' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SERVER_HEARTBEAT: ${{ vars.SERVER_HEARTBEAT }}
          SERVER_ALERT_STATE: ${{ vars.SERVER_ALERT_STATE }}
          LOOP_ITERATIONS: '15'
          LOOP_SLEEP_SEC: '120'
        run: |
          python3 watchdog.py --loop
