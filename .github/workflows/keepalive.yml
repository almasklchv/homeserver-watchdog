name: Keepalive Workflow

on:
  schedule:
    # Runs every 25 days to prevent GitHub from pausing scheduled workflows after 60 days
    - cron: '0 0 */25 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    name: Prevent Inactivity Suspension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .github/keepalive.txt
          git add .github/keepalive.txt
          git commit -m "chore: keepalive [skip ci]" || exit 0
          git push
